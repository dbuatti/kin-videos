function selAll(v){for(var i=0;i<DATA.length;i++){if(v)checked.add(i);else checked.delete(i);}var vids=document.querySelectorAll('.video');for(var j=0;j<vids.length;j++){var vid=vids[j];var idx=+vid.getAttribute('data-idx');vid.classList.toggle('checked',checked.has(idx));vid.querySelector('input').checked=checked.has(idx);}save();}
function selMod(v,mod){for(var i=0;i<DATA.length;i++){if(DATA[i].mod===mod){if(v)checked.add(i);else checked.delete(i);}}var vids=document.querySelectorAll('.video[data-idx]');for(var j=0;j<vids.length;j++){var idx=+vids[j].getAttribute('data-idx');var vd=vids[j];vd.classList.toggle('checked',checked.has(idx));vd.querySelector('input').checked=checked.has(idx);}save();}
function exportList(){var s=DATA.filter(function(_,i){return checked.has(i);}).map(function(v,idx){return (idx+1)+'. Module '+v.mod+' | '+v.cat+' | Lesson '+ (v.lesson||'')+' | '+v.title+'\n   URL: '+v.url+'\n   Page: '+v.page;}).join('\n');var b=new Blob(['FNH Videos to Download - '+checked.size+' videos\nGenerated: '+new Date().toISOString()+'\n\n'+s],{type:'text/plain'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fnh-videos-download-'+Date.now()+'.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);}
function downloadSelectedVideos(){function downloadSelectedVideos(){var items=DATA.filter(function(_,i){return checked.has(i);});if(items.length===0){alert('No videos selected');return;}var count=0;items.forEach(function(v,i){var filename='' + v.mod + ' - ' + (v.lesson||'') + ' - ' + v.title;filename=filename.replace(/[\/:*?"<>|]/g,''-');filename=filename.replace(/\s+/g,' ').trim();filename=filename.replace(/ - $/,'');filename=filename||'video';filename=filename+'.mp4';fetch(v.url).then(function(response){if(!response.ok){throw new Error('HTTP '+response.status);}return response.blob();}).then(function(blob){var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);count++;if(count===items.length){alert('Downloaded '+count+' video(s)');}}).catch(function(err){console.error('Failed '+v.title+':',err);});});}

function copyUrls(){var u=DATA.filter(function(_,i){return checked.has(i);}).map(function(v){return v.url;}).join('\n');navigator.clipboard.writeText(u).then(function(){alert('Copied '+checked.size+' URLs');});}
function render(){
  var el=document.getElementById('list');
  el.innerHTML='';
  var lastMod=null;
  for(var i=0;i<DATA.length;i++){
    var v=DATA[i];
    if(v.mod!==lastMod){
      var md=document.createElement('div');md.className='mod';
      var mh=document.createElement('h2');mh.textContent='Module '+v.mod;
      var sz=document.createElement('span');sz.className='modsz';sz.textContent='('+DATA.filter(function(x){return x.mod===v.mod;}).length+' videos)';
      mh.appendChild(sz);var mb=document.createElement('button');mb.className='mod-btn';mb.textContent='Select all';mb.onclick=(function(v){return function(){selMod(true,v.mod);};})(v);var db=document.createElement('button');db.className='dl-btn';db.textContent='DL MP4s';db.onclick=function(){downloadSelectedVideos();};mh.appendChild(mb);mh.appendChild(db);md.appendChild(mh);el.appendChild(md);lastMod=v.mod;
    }
    var vd=document.createElement('div');vd.className='video'+(checked.has(i)?' checked':'');vd.setAttribute('data-idx',i);
    var cb=document.createElement('input');cb.type='checkbox';cb.checked=checked.has(i);
    var info=document.createElement('div');info.className='info';
    var t=document.createElement('div');t.className='title';t.textContent=(v.lesson? v.lesson+'. ':'')+v.title;
    var m2=document.createElement('div');m2.className='meta';
    var a=document.createElement('a');a.className='url';a.href=v.page;a.target='_blank';a.rel='noopener';a.textContent='View in Kajabi ↗';
    m2.appendChild(a);info.appendChild(t);info.appendChild(m2);
    vd.appendChild(cb);vd.appendChild(info);
    (function(vd,cb,idx){
      cb.onchange=function(e){if(e.target.checked)checked.add(idx);else checked.delete(idx);vd.classList.toggle('checked',e.target.checked);save();};
      vd.onclick=function(e){if(e.target.tagName==='A')return;cb.checked=!cb.checked;var ev=document.createEvent('Event');ev.initEvent('change',true,true);cb.dispatchEvent(ev);};
    })(vd,cb,i);
    var curMod=document.querySelector('.mod:last-child');
    if(curMod && curMod.className==='mod') curMod.appendChild(vd);
  }
}
render();save();
</script>
</body></html>
