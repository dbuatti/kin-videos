<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FNH Hub</title>
<style>
 :root{--bg:#0f1216;--card:#171c22;--card2:#1d242c;--line:#2a333d;--fg:#e9eef4;--dim:#8b98a7;
       --w:#38bdf8;--p:#f59e0b;--t:#34d399;--acc:#6ee7b7;--warn:#f59e0b}
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{height:100%}
 body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:flex;flex-direction:column;overflow:hidden}
 button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
 a{color:var(--acc);text-decoration:none}
 input{font:inherit}

 /* ---- header ---- */
 header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);
        background:#12161b;flex:0 0 auto;flex-wrap:wrap}
 .brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
 .brand b{color:var(--fg);font-weight:650}
 .tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px}
 .tabs button{padding:6px 13px;border-radius:8px;font-size:13px;font-weight:600;color:var(--dim)}
 .tabs button.on{background:#12312c;color:var(--acc)}
 .spacer{flex:1}
 .head-right{display:flex;align-items:center;gap:8px}

 .timerbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);
           border-radius:11px;padding:5px 11px 5px 7px;color:var(--fg);font-variant-numeric:tabular-nums}
 .timerbtn:hover{border-color:#3a4754}
 .timerbtn.run{border-color:#1f5f54;color:var(--acc)}
 .timerbtn.over{border-color:#7c5a10;color:var(--warn)}
 .tring{width:20px;height:20px;transform:rotate(-90deg)}
 .tring circle{fill:none;stroke-width:3.5}
 .tring .bgc{stroke:#232b34}
 .tring .fgc{stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .3s}
 .tlabel{font-size:12px;font-weight:650;min-width:46px;text-align:left}

 .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);
           color:var(--dim);display:grid;place-items:center}
 .icon-btn:hover{color:var(--fg);border-color:#3a4754}

 /* ---- panels ---- */
 .panel{position:fixed;top:60px;right:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:14px;width:250px;z-index:60;display:none;box-shadow:0 20px 50px rgba(0,0,0,.5)}
 .panel.on{display:block}
 .dial-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
 .presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
 .presets button{border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;color:var(--dim);font-weight:600}
 .presets button.on{border-color:var(--acc);color:var(--acc)}
 .numrow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
 .numrow input{width:82px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;
                color:var(--fg);outline:none}
 .numrow span{font-size:12px;color:var(--dim)}
 .poprow{display:flex;gap:6px}
 .poprow button{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12.5px;font-weight:650;color:var(--dim)}
 .poprow button:hover{color:var(--fg);border-color:#3a4754}
 .poprow button.go{background:var(--acc);color:#0b1a16;border-color:transparent}

 /* ---- main ---- */
 main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
 .tab{display:none;flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
 .tab.on{display:flex}
 .col{max-width:760px;width:100%;margin:0 auto;padding:18px 16px 40px}
 .studycol{max-width:620px}
 /* a tab that is nothing but a website: full bleed, no padding, no chrome */
 .tab.bleed{overflow:hidden}
 .tab.bleed .col{max-width:none;padding:0}
 .bleedframe{width:100%;height:100%;border:0;display:block;background:#fff}
 .tab.bleed .col{flex:1;display:flex;min-height:0;max-width:none;padding:0}
 #tab-course .col{max-width:1180px}
 #tab-library .col{max-width:900px}
 .bleednote{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center}
 .bleednote div{max-width:46ch}
 .bleednote b{display:block;font-size:17px;margin-bottom:8px}
 .bleednote p{color:var(--dim);font-size:14px;line-height:1.6;margin:0 0 16px}

 /* ---- study tab (the one button) ---- */
 .dials{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:0 0 4px;flex:0 0 auto}
 .dial{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
 .track{position:relative;height:30px;border-radius:15px;background:var(--card2);border:1px solid var(--line);
        display:flex;align-items:center;padding:0 4px}
 .stop{flex:1;height:24px;border-radius:12px;color:var(--dim);font-size:12px;font-weight:600;display:grid;place-items:center;
       position:relative;z-index:2;transition:color .18s}
 .stop.on{color:#0f1216;font-weight:700}
 .track .knob{position:absolute;top:2px;left:2px;width:calc((100% - 4px)/3);height:24px;border-radius:12px;
               background:var(--acc);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:1}
 .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;height:52px}
 .seg button{padding:0 13px;font-size:12.5px;font-weight:650;color:var(--dim);white-space:nowrap}
 .seg button.on{background:#12312c;color:var(--acc)}
 .stage{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-start;min-height:0;overflow:auto;
        padding-bottom:6px}
 /* auto margins centre the group without the overflow clipping that
    justify-content:center causes when the content is taller than the stage */
 .stage>*:first-child{margin-top:auto}
 .stage>*:last-child{margin-bottom:auto}
 .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px;text-align:center}
 .player{margin:0 0 16px;border-radius:12px;overflow:hidden;background:#000;line-height:0}
 .player video{width:100%;max-height:42vh;display:block;background:#000}
 .mod{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--acc);font-weight:700}
 .title{font-size:23px;line-height:1.25;font-weight:650;margin:10px 0 8px;letter-spacing:-.01em}
 .meta{font-size:13px;color:var(--dim);display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
 .pill{border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--dim);font-weight:600}
 .note{font-size:13px;color:var(--dim);margin-top:14px;font-style:italic;line-height:1.5}
 .stage-ask{font-size:13px;color:var(--acc);margin-top:14px}
 .oversize{font-size:12.5px;color:var(--warn);margin-top:12px;line-height:1.5}
 .bigbtn{width:100%;margin-top:16px;background:var(--acc);color:#0b1a16;border-radius:16px;padding:19px 18px;
         font-size:17px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:10px;
         box-shadow:0 10px 30px rgba(110,231,183,.14);transition:transform .12s ease}
 .bigbtn:hover{box-shadow:0 14px 38px rgba(110,231,183,.22)}
 .bigbtn:active{transform:scale(.985)}
 .bigbtn .arrow{font-size:20px;line-height:1}
 .subrow{display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap}
 .ghost{border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-size:12.5px;color:var(--dim);font-weight:600}
 .ghost:hover{color:var(--fg);border-color:#3a4754}
 .kajabi{text-align:center;margin-top:12px;font-size:12px}
 .kajabi a{color:var(--dim);text-decoration:none;border-bottom:1px dotted #3a4754}
 .kajabi a:hover{color:var(--acc);border-bottom-color:var(--acc)}
 .foot{padding-top:12px;border-top:1px solid var(--line);margin-top:6px;display:flex;align-items:center;
       justify-content:space-between;gap:12px;font-size:12px;color:var(--dim)}
 .dots{display:flex;gap:4px;align-items:center}
 .dot{width:8px;height:8px;border-radius:50%;background:#232b34}
 .dot.on{background:var(--acc)}
 .dot.today{box-shadow:0 0 0 2px rgba(110,231,183,.22)}
 .where{font-variant-numeric:tabular-nums}

 /* ---- course tab ---- */
 .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
 .toolbar input[type=search]{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:9px 12px;color:var(--fg);font-size:14px;outline:none}
 .toolbar input[type=search]:focus{border-color:var(--acc)}
 .chip{border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:20px;padding:6px 12px;font-size:12.5px;cursor:pointer}
 .chip.on{background:#12312c;border-color:#1f5f54;color:var(--acc)}
 .modbox{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
 .modhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:10px;cursor:pointer}
 .modhead h3{font-size:13.5px;margin:0;font-weight:650}
 .modhead .mc{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
 .modbar{height:3px;background:#242c35}
 .modbar i{display:block;height:100%;background:var(--acc);width:0}
 .moditems{display:none;border-top:1px solid var(--line)}
 .modbox.open .moditems{display:block}
 .crow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
 .crow:last-child{border-bottom:0}
 .crow .ct{flex:1;min-width:0;font-size:13.5px}
 .crow .ct a{color:var(--fg)}
 .crow .ct a:hover{color:var(--acc)}
 .crow .cd{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
 .tick{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);color:var(--dim);font-size:11px;
       font-weight:800;display:grid;place-items:center;flex:0 0 auto}
 .tick.w.on{background:#0c3a52;border-color:#1d5f86;color:var(--w)}
 .tick.p.on{background:#4a3410;border-color:#8a5f14;color:var(--p)}
 .tick.t.on{background:#0f3a2c;border-color:#1f6b52;color:var(--t)}
 .mini{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);color:var(--dim);display:grid;place-items:center;flex:0 0 auto}
 .mini:hover{color:var(--fg);border-color:#3a4754}

 /* ---- community / library tabs ---- */
 .h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px;font-weight:700}
 .h2:first-child{margin-top:0}
 .door{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border:1px solid var(--line);
       border-radius:14px;padding:16px 18px}
 .door b{font-size:15px;display:block;margin-bottom:2px}
 .door span{font-size:12.5px;color:var(--dim)}
 .door a{border:1px solid var(--line);border-radius:10px;padding:9px 15px;font-size:13px;font-weight:650;color:var(--fg);white-space:nowrap}
 .door a:hover{border-color:var(--acc);color:var(--acc)}
 .linklist{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
 .lrow{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line)}
 .lrow:last-child{border-bottom:0}
 .lrow .lt{flex:1;min-width:0;font-size:13.5px;line-height:1.45}
 .lrow .lt small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
 .lrow a:hover{color:var(--acc)}
 .tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
 .tool{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px;display:block}
 .tool:hover{border-color:#3a4754}
 .tool b{display:block;font-size:13.5px;margin-bottom:3px}
 .tool span{font-size:12px;color:var(--dim);line-height:1.4}
 .empty{text-align:center;color:var(--dim);font-size:13px;padding:26px 0}
 .snapshot{font-size:12.5px;color:var(--dim);line-height:1.55;margin:12px 0 0;padding:11px 13px;
           border-left:2px solid var(--line);background:rgba(255,255,255,.02);border-radius:0 8px 8px 0}
 .snapshot b{color:var(--muted,#c7d2de)}
 .livedoor{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:4px}
 .livehead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
 .livehead b{font-size:15px}
 .livehead span{font-size:12.5px;color:var(--dim);flex:1;min-width:180px;line-height:1.45}
 .livehead span b{font-size:12.5px;color:var(--ink)}
 .livehead a{border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:650;color:var(--fg);white-space:nowrap}
 .livehead a:hover{border-color:var(--acc);color:var(--acc)}
 .livedoor iframe{width:100%;height:min(74vh,820px);border:0;display:block;background:#fff}

 /* ---- toast / sheet / time-up ---- */
 .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#202a33;color:var(--fg);
        border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;
        transition:.22s;z-index:70;max-width:90vw;text-align:center}
 .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
 .sheet{position:fixed;inset:0;background:rgba(6,9,12,.72);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-end;justify-content:center}
 .sheet.on{display:flex}
 .sheet-inner{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:620px;
              max-height:78vh;overflow:auto;padding:20px 18px 26px;position:relative}
 .sheet h2{font-size:15px;margin:0 0 4px;font-weight:650}
 .sheet p.sub{font-size:12.5px;color:var(--dim);margin:0 0 14px}
 .sheet-close{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:8px;color:var(--dim);
              border:1px solid var(--line);display:grid;place-items:center}
 .plist{list-style:none;margin:0;padding:0}
 .plist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
 .plist .pt{flex:1;min-width:0}
 .plist .pt b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .plist .pt span{font-size:11.5px;color:var(--dim)}
 .mini2{border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:11.5px;color:var(--dim);font-weight:600}
 .mini2:hover{color:var(--fg)}
 .overlay{position:fixed;inset:0;background:rgba(6,9,12,.88);z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
 .overlay.on{display:flex}
 .overlay .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 26px;max-width:400px;text-align:center}
 .overlay h1{font-size:22px;margin:0 0 8px;font-weight:650}
 .overlay p{color:var(--dim);font-size:14px;margin:0 0 18px;line-height:1.6}
 @media(max-width:520px){
   .dials{grid-template-columns:1fr auto;gap:8px}
   .dial{padding:8px 10px}
   .dial-label{margin-bottom:5px;font-size:9.5px}
   .seg button{padding:0 9px;font-size:11.5px}
   .seg{height:40px}
   .title{font-size:20px}
   header{gap:8px;padding:10px 12px}
   .brand{display:none}
   .tabs{order:-1;width:100%;justify-content:space-between}
   .tabs button{flex:1;padding:6px 4px;font-size:12.5px;text-align:center}
   .head-right{margin-left:auto}
 }
 /* short screens: keep the whole card, the button and its options on screen */
 @media(max-height:960px){
   .player video{max-height:32vh}
   .card{padding:20px 18px}
   .title{font-size:21px;margin:8px 0 7px}
 }
 @media(max-height:780px){
   .player video{max-height:30vh}
   .card{padding:18px 16px}
   .title{font-size:19px;margin:7px 0 6px}
   .note{display:none}
   .bigbtn{padding:15px 16px;margin-top:12px}
   .dials{margin-bottom:0}
   .dial{padding:7px 10px}
   .dial-label{margin-bottom:5px}
   .track{height:26px}
   .stop{height:21px}
   .track .knob{height:21px;top:1.5px}
 }
 @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>

<header>
  <div class="brand">FNH · <b>hub</b></div>
  <nav class="tabs" id="tabs">
    <button data-tab="study" class="on">Study</button>
    <button data-tab="course">Course</button>
    <button data-tab="community">Community</button>
    <button data-tab="library">Library</button>
  </nav>
  <div class="spacer"></div>
  <div class="head-right">
    <button class="timerbtn" id="timerBtn" title="Session timer">
      <svg class="tring" viewBox="0 0 24 24"><circle class="bgc" cx="12" cy="12" r="9"></circle><circle class="fgc" id="trArc" cx="12" cy="12" r="9" stroke-dasharray="56.5" stroke-dashoffset="56.5"></circle></svg>
      <span class="tlabel" id="timerText">30:00</span>
    </button>
    <button class="icon-btn" id="btnParked" title="Parked">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 12 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
    </button>
  </div>
</header>

<div class="panel" id="timerPop">
  <div class="dial-label">Session</div>
  <div class="presets" id="presets">
    <button data-m="10">10</button><button data-m="15">15</button><button data-m="20">20</button>
    <button data-m="30">30</button><button data-m="45">45</button><button data-m="60">60</button>
  </div>
  <div class="numrow">
    <input type="number" id="timerMins" min="5" max="240" step="5" placeholder="mins">
    <span>minutes, your call</span>
  </div>
  <div class="poprow">
    <button id="timerToggle" class="go">start</button>
    <button id="timerReset">reset</button>
  </div>
</div>

<main>
  <!-- ================= STUDY ================= -->
  <section class="tab on" id="tab-study">
    <div class="col studycol" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="dials">
        <div class="dial">
          <div class="dial-label">Energy</div>
          <div class="track" id="energyTrack" role="radiogroup" aria-label="Energy">
            <div class="knob" id="energyKnob"></div>
            <button class="stop" data-energy="low" role="radio">low</button>
            <button class="stop" data-energy="steady" role="radio">steady</button>
            <button class="stop" data-energy="high" role="radio">high</button>
          </div>
        </div>
        <div class="dial">
          <div class="dial-label">Next one</div>
          <div class="seg" id="sizeSeg" role="radiogroup" aria-label="Size of the next thing">
            <button data-size="5" role="radio">5 min</button>
            <button data-size="20" role="radio">20 min</button>
            <button data-size="30" role="radio">30 min</button>
          </div>
        </div>
      </div>
      <div class="stage" id="stage">
        <div class="card" id="card">
          <div class="player" id="playerHost" hidden></div>
          <div id="cardBody"></div>
        </div>
        <div id="actions"></div>
      </div>
      <div class="foot">
        <div class="dots" id="dots"></div>
        <div class="where" id="where"></div>
      </div>
    </div>
  </section>

  <!-- ================= COURSE ================= -->
  <section class="tab" id="tab-course"><div class="col" id="courseCol"></div></section>

  <!-- ================= COMMUNITY ================= -->
  <section class="tab" id="tab-community"><div class="col" id="communityCol"></div></section>

  <!-- ================= LIBRARY ================= -->
  <section class="tab" id="tab-library"><div class="col" id="libraryCol"></div></section>
</main>

<div class="sheet" id="parkedSheet">
  <div class="sheet-inner">
    <button class="sheet-close" id="closeParked">✕</button>
    <h2>Parked</h2>
    <p class="sub">Set aside, not skipped. Nothing is lost here — bring any of it back when you have the energy.</p>
    <ul class="plist" id="parkedList"></ul>
    <div style="text-align:center;margin-top:16px"><button class="mini2" id="unparkAll">Bring everything back</button></div>
  </div>
</div>

<div class="overlay" id="timeUp">
  <div class="box">
    <h1>That's your time.</h1>
    <p>Nothing is lost. Whatever is part-done stays part-done, and tomorrow the button picks it up where you left it.</p>
    <div class="poprow" style="max-width:260px;margin:0 auto">
      <button class="go" id="timeUpOk">Park it</button>
      <button id="timeUpMore">Keep going</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

function timerLeft(){
  if (timer.running && timer.endsAt) return Math.max(0, Math.round((timer.endsAt - Date.now())/1000));
  return timer.remaining;
}
function paintTimer(){
  const left = timerLeft();
  const total = Math.max(1, timer.mins*60);
  const pct = Math.max(0, Math.min(1, left/total));
  const arc = $('#trArc');
  arc.style.strokeDashoffset = (56.5 * (1-pct)).toFixed(2);
  $('#timerText').textContent = clock(left);
  const btn = $('#timerBtn');
  btn.classList.toggle('run', timer.running);
  btn.classList.toggle('over', left <= 0);
  $('#timerToggle').textContent = timer.running ? 'pause' : (left < total ? 'resume' : 'start');
}
function startTimer(){
  if (timer.remaining <= 0) timer.remaining = timer.mins*60;
  timer.endsAt = Date.now() + timer.remaining*1000;
  timer.running = true; timer.over = false;
  saveTimer(); paintTimer();
}
function pauseTimer(){
  if (timer.running){ timer.remaining = timerLeft(); timer.running = false; timer.endsAt = null; saveTimer(); paintTimer(); }
}
function resetTimer(){
  timer.remaining = timer.mins*60; timer.running = false; timer.endsAt = null; timer.over = false;
  saveTimer(); paintTimer();
}
function setMinutes(m){
  timer.mins = m; timer.remaining = m*60; timer.endsAt = null; timer.running = false; timer.over = false;
  saveTimer(); paintTimer();
  $$('#presets button').forEach(b => b.classList.toggle('on', Number(b.dataset.m) === m));
  $('#timerMins').value = m;
}
$('#timerBtn').onclick = e => { e.stopPropagation(); $('#timerPop').classList.toggle('on'); paintTimer(); };
document.addEventListener('click', e => { if (!e.target.closest('#timerPop') && !e.target.closest('#timerBtn')) $('#timerPop').classList.remove('on'); });
$$('#presets button').forEach(b => b.onclick = () => setMinutes(Number(b.dataset.m)));
$('#timerMins').onchange = e => { const v = Math.max(5, Math.min(240, Number(e.target.value)||30)); setMinutes(v); };
$('#timerToggle').onclick = () => { timer.running ? pauseTimer() : startTimer(); };
$('#timerReset').onclick = resetTimer;

function chime(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const ctx = new AC();
    [523.25, 659.25, 783.99].forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain(); o.type='sine'; o.frequency.value=f;
      o.connect(g); g.connect(ctx.destination);
      const t0=ctx.currentTime+i*0.22;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.07,t0+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+1.4);
      o.start(t0); o.stop(t0+1.5);
    });
  }catch(e){}
}

function estimate(it){
  if (it.k === 'video') return (it.d || 0)/60;
  if (it.k === 'audio') return 4;
  if (it.k === 'quiz')  return 3;
  if (it.k === 'image') return 0.5;
  if (it.k === 'pdf' || it.k === 'doc') return Math.max(1.5, (it.p || 1) * 1.2);
  return 2;
}
function isLocal(it){ return /\.(mp4|pdf|docx|pages|png|jpg|jpeg|m4a|mp3)$/i.test(it.id); }
function isLocalVideo(it){ return /\.(mp4|m4v|mov|mkv)$/i.test(it.id); }
/* A video plays from its direct URL, unless the lesson is a local video file.
   (A lesson id can point at a local PDF handout — never play that.) */
function target(it){
  if (it.k === 'video') return isLocalVideo(it) ? encodeURI(it.id) : (it.url || it.page || '#');
  if (isLocal(it)) return encodeURI(it.id);
  return it.url || it.page || '#';
}

function stagesFor(energy){
  if (energy === 'low')    return ['see','revise'];
  if (energy === 'steady') return ['see','do'];
  return ['see','do','teach'];
}
function stageOf(it){ const s = get(it.id); if(!s.w) return 'see'; if(!s.p) return 'do'; if(!s.t) return 'teach'; return 'done'; }
function stageForSession(it){
  const st = stageOf(it);
  if (st === 'do' && mine.energy === 'low') return 'revise';
  return st;
}
const VERB = {
  see:   { video:'Watch this',  pdf:'Read this',   doc:'Read this',  audio:'Listen to this', quiz:'Open this quiz', image:'Look at this' },
  do:    { video:'Practise it', pdf:'Use it on a body', doc:'Use it on a body', audio:'Listen again', quiz:'Try the quiz', image:'Use it on a body' },
  teach: { video:'Say it back', pdf:'Say it back', doc:'Say it back', audio:'Say it back', quiz:'Say it back', image:'Say it back' },
  revise:{ video:'Revise this', pdf:'Skim it again', doc:'Skim it again', audio:'Listen again', quiz:'Try it again', image:'Look again' }
};

function poolFor(energy){
  const parked = new Set(mine.parked);
  const live = DATA.filter(it => !parked.has(it.id));
  const seen = it => get(it.id).w;
  const unseen = it => !get(it.id).w;
  if (energy === 'low'){
    const light = live.filter(it => unseen(it) && (
      it.k === 'audio' || it.k === 'quiz' || it.k === 'image' ||
      (it.k === 'pdf' && (it.p||0) <= 24) || (it.k === 'video' && estimate(it) <= 6)));
    if (light.length) return { priority: [], rest: light };
    const revise = live.filter(it => seen(it) && !get(it.id).p);
    if (revise.length) return { priority: [], rest: revise };
    return { priority: [], rest: live.filter(unseen) };
  }
  if (energy === 'high'){
    const toTeach = live.filter(it => seen(it) && get(it.id).p && !get(it.id).t);
    const deep = live.filter(it => unseen(it) && it.k === 'video' &&
      /demo|assessment|correction|procedure|full session|masterclass|integration|test/i.test(it.t));
    if (deep.length) return { priority: toTeach, rest: deep };
    const anyVideo = live.filter(it => unseen(it) && it.k === 'video');
    if (anyVideo.length) return { priority: toTeach, rest: anyVideo };
    return { priority: toTeach, rest: live.filter(unseen) };
  }
  const unfinished = live.filter(it => seen(it) && !get(it.id).p && it.k !== 'audio');
  const fresh = live.filter(it => unseen(it) && it.k !== 'audio');
  return { priority: unfinished, rest: fresh };
}

let currentFits = true;
function choose(){
  const stages = stagesFor(mine.energy);
  const budget = mine.size === 5 ? 7 : (mine.size === 20 ? 22 : 34);
  const { priority, rest } = poolFor(mine.energy);
  const usable = list => list.filter(it => {
    const st = stageForSession(it);
    if (st === 'done') return false;
    if (st === 'teach' && mine.energy !== 'high') return false;
    return stages.includes(st);
  });
  const byOrder = (a,b) => order.get(a.id) - order.get(b.id);
  const NEIGHBOURHOOD = 14;
  const pickFrom = list => {
    if (!list.length) return null;
    const near = list.slice().sort(byOrder).slice(0, NEIGHBOURHOOD);
    const fits = near.filter(it => estimate(it) <= budget);
    if (fits.length){
      const best = Math.max.apply(null, fits.map(estimate));
      return fits.filter(it => estimate(it) >= best - 2.5).sort(byOrder)[0];
    }
    return near.slice().sort((a,b)=>estimate(a)-estimate(b))[0];
  };
  const pri = usable(priority);
  if (pri.length){ const p = pickFrom(pri); if (p && estimate(p) <= budget){ currentFits = true; return p; } }
  const p = pickFrom(usable(rest));
  if (p){ currentFits = estimate(p) <= budget; return p; }
  const all = usable(priority).concat(usable(rest)).sort(byOrder);
  if (!all.length) return null;
  currentFits = false;
  return all[0];
}

/* the video player */
let videoEl = null;
let playing = false;
function buildVideo(it){
  const v = document.createElement('video');
  v.controls = true; v.preload = 'metadata'; v.playsInline = true;
  v.dataset.itemId = it.id;
  v.style.width = '100%'; v.style.display='block'; v.style.maxHeight='42vh'; v.style.background='#000';
  v.src = target(it);
  const saved = positions[it.id];
  if (saved > 3) v.addEventListener('loadedmetadata', ()=>{ try{ v.currentTime = saved; }catch(e){} }, {once:true});
  v.addEventListener('timeupdate', ()=>savePos(it.id, v.currentTime));
  v.addEventListener('ended', ()=>savePos(it.id, v.duration || 0));
  v.addEventListener('play', ()=>{ playing = true; updateGoLabel(); });
  v.addEventListener('pause', ()=>{ if(!v.ended){ playing = false; updateGoLabel(); } });
  return v;
}
function slotVideo(it){
  if (!videoEl || videoEl.dataset.itemId !== it.id){ stopVideo(); videoEl = buildVideo(it); }
  return videoEl;
}
function stopVideo(){
  if (!videoEl) return;
  try{ videoEl.pause(); }catch(e){}
  if (videoEl.parentElement) videoEl.parentElement.removeChild(videoEl);
  videoEl = null; playing = false;
}
function startVideo(){
  if (!videoEl) return;
  const p = videoEl.play();
  if (p && p.catch) p.catch(()=>toast('Press play on the video itself to start it.'));
  updateGoLabel();
}
function updateGoLabel(){
  const b = $('#go'); if (!b || !current) return;
  const st = stageForSession(current);
  if (current.k === 'video' && st === 'see'){
    b.innerHTML = `<span>${playing ? 'Mark it seen' : 'Watch this'}</span><span class="arrow">→</span>`;
    const a = $('#cardBody .stage-ask');
    if (a) a.textContent = playing ? 'Press again when it has landed.' : 'Press to play it here.';
  }
}

  if (!current){
    const seen = DATA.filter(it => get(it.id).w).length;
    body.innerHTML = `<div style="text-align:center;padding:26px 0">
      <h1 style="font-size:24px;margin:0 0 8px;font-weight:650">Nothing waiting.</h1>
      <p style="color:var(--dim);font-size:14px;margin:0 auto;max-width:34ch;line-height:1.6">
        ${seen ? `You have been through ${seen} of ${DATA.length} items. Change the dials, or open the Course tab to see the whole course.`
               : 'Change the dials above — a different energy or size will open a different door.'}</p></div>`;
    actions.innerHTML = '';
    host.hidden = true; stopVideo(); renderFoot(); return;
  }
  const it = current, st = stageForSession(it), s = get(it.id), isVideo = it.k === 'video';
  const modNote = NOTE_OF(it.m);
  const len = it.k === 'video' ? (it.d||0) : it.k === 'audio' ? '' : it.k === 'quiz' ? '' : (it.p ? (it.p + ' pp') : '');
  let verb = (VERB[st] && VERB[st][it.k]) || 'Do this';
  if (isVideo && st === 'see') verb = playing ? 'Mark it seen' : 'Watch this';
  const ask = isVideo && st === 'see' ? (playing ? 'Press again when it has landed.' : 'Press to play it here.')
            : (it.k === 'audio' && st === 'see' ? 'Listen to it, then press again when it has landed.' : ASK[st]);
  body.innerHTML = `
      <div class="mod">${esc(it.m)}</div>
      <div class="title">${esc(it.t)}</div>
      <div class="meta">
        <span class="pill">${esc(it.k)}</span>
        ${len ? `<span class="pill">${esc(typeof len === 'number' ? Math.floor(len/60)+':'+String(len%60).padStart(2,'0') : len)}</span>` : ''}
        ${s.w ? `<span class="pill" style="color:var(--acc)">seen</span>` : ''}
        ${s.p ? `<span class="pill" style="color:var(--p)">practised</span>` : ''}
        ${s.t ? `<span class="pill" style="color:var(--t)">can teach</span>` : ''}
      </div>
      ${modNote ? `<div class="note">${esc(modNote)}</div>` : ''}
      ${currentFits === false ? `<div class="oversize">Nothing here fits ${mine.size} minutes. This one is about ${Math.round(estimate(it))} — take it if you can spare it, or change the size.</div>` : ''}
      <div class="stage-ask">${esc(ask)}</div>`;
  actions.innerHTML = `
    <button class="bigbtn" id="go"><span>${esc(verb)}</span><span class="arrow">→</span></button>
    <div class="subrow">
      <button class="ghost" id="park">not now</button>
      ${isVideo ? '<button class="ghost" id="open">open in my player</button>' : ''}
      ${st === 'see' && !isVideo ? '<button class="ghost" id="open">open without marking</button>' : ''}
    </div>
    ${it.page ? `<div class="kajabi"><a href="${esc(it.page)}" target="_blank" rel="noopener">mark this complete in Kajabi ↗</a></div>` : ''}`;
  if (isVideo){ host.hidden = false; const el = slotVideo(it); if (el.parentElement !== host) host.appendChild(el); }
  else { host.hidden = true; stopVideo(); }
  $('#go').onclick = doStage;
  $('#park').onclick = parkCurrent;
  const ob = $('#open');
  if (ob) ob.onclick = () => { window.open(target(it), '_blank', 'noopener'); toast(isVideo ? 'Opened in a new tab.' : 'Opened — mark it when you are ready.'); };
  renderFoot();
}

function doStage(){
  const it = current; if (!it) return;
  const st = stageForSession(it), s = get(it.id);
  if (st === 'see' && it.k === 'video' && !playing){ startVideo(); return; }
  if (st === 'see'){
    if (it.k !== 'video') window.open(target(it), '_blank', 'noopener');
    s.w = 1; mine.session.push(it.id); mine.history.push({id:it.id, at:Date.now()});
    if (mine.history.length > 400) mine.history = mine.history.slice(-400);
    saveTicks(); saveMine(); toast('Marked as seen.');
  } else if (st === 'revise'){
    if (it.k === 'video' && videoEl){ const p = videoEl.play(); if (p && p.catch) p.catch(()=>{}); }
    else window.open(target(it), '_blank', 'noopener');
    mine.session.push(it.id); mine.history.push({id:it.id, at:Date.now()}); saveMine();
    toast('Revisited.'); current = choose();
  } else if (st === 'do'){
    s.p = 1; mine.session.push(it.id); saveTicks(); saveMine(); toast('Marked as practised.');
  } else if (st === 'teach'){
    s.t = 1; mine.session.push(it.id); saveTicks(); saveMine(); toast('That one is yours.');
  }
  const still = stageForSession(it);
  if (still === 'done' || !stagesFor(mine.energy).includes(still)) current = choose();
  render();
}

function parkCurrent(){
  if (!current) return;
  if (!mine.parked.includes(current.id)) mine.parked.push(current.id);
  saveMine();
  const t = current.t;
  current = choose(); render();
  toast(`Parked “${t.length > 34 ? t.slice(0,34)+'…' : t}”.`);
  updateParkPip();
}
function updateParkPip(){
  const p = $('#btnParked');
  p.style.opacity = mine.parked.length ? '1' : '.6';
  p.title = mine.parked.length ? `Parked (${mine.parked.length})` : 'Parked';
}
function renderParked(){
  const ul = $('#parkedList');
  if (!mine.parked.length){ ul.innerHTML = '<div class="empty">Nothing parked. That is fine — parking is for the days you need it.</div>'; return; }
  const byId = new Map(DATA.map(it => [it.id, it]));
  ul.innerHTML = mine.parked.map(id => {
    const it = byId.get(id); if (!it) return '';
    const s = get(id);
    const bits = [s.w?'seen':'', s.p?'practised':'', s.t?'can teach':''].filter(Boolean).join(' · ') || 'not started';
    return `<li><div class="pt"><b>${esc(it.t)}</b><span>${esc(it.m)} · ${bits}</span></div>
      <button class="mini2" data-unpark="${esc(id)}">bring back</button></li>`;
  }).join('');
  ul.querySelectorAll('[data-unpark]').forEach(b => b.onclick = () => {
    mine.parked = mine.parked.filter(x => x !== b.dataset.unpark);
    saveMine(); updateParkPip(); renderParked(); current = choose(); render();
  });
}
$('#btnParked').onclick = () => { renderParked(); $('#parkedSheet').classList.add('on'); };
$('#closeParked').onclick = () => $('#parkedSheet').classList.remove('on');
$('#parkedSheet').onclick = e => { if (e.target.id === 'parkedSheet') $('#parkedSheet').classList.remove('on'); };
$('#unparkAll').onclick = () => { mine.parked = []; saveMine(); updateParkPip(); renderParked(); current = choose(); render(); };

function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function renderFoot(){
  const days = {};
  (mine.history||[]).forEach(h => days[dayKey(h.at)] = true);
  const today = new Date();
  const dots = [];
  for (let i=13;i>=0;i--){
    const d = new Date(today.getTime() - i*86400000);
    dots.push(`<div class="dot ${days[dayKey(d.getTime())]?'on':''} ${i===0?'today':''}"></div>`);
  }
  $('#dots').innerHTML = dots.join('');
  const seen = DATA.filter(it => get(it.id).w).length;
  $('#where').textContent = current ? `${groupOf(current.m)} · ${seen} seen` : `${seen} of ${DATA.length} seen`;
  const activeDays = Object.keys(days).filter(k => { const diff=(today - new Date(k+'T00:00:00').getTime())/86400000; return diff<14 && diff>=0; }).length;
  $('#dots').title = activeDays ? `You have worked with this on ${activeDays} of the last 14 days. No streak to keep — just keep going when you can.`
                              : 'Nothing yet. One press is enough to start.';
}

/* dials */
function paintDials(){
  ['low','steady','high'].forEach(e => {
    const b = document.querySelector(`[data-energy="${e}"]`);
    b.classList.toggle('on', mine.energy === e);
  });
  $('#energyKnob').style.transform = `translateX(${['low','steady','high'].indexOf(mine.energy)*100}%)`;
  $$('#sizeSeg button').forEach(b => b.classList.toggle('on', Number(b.dataset.size) === mine.size));
}
$$('[data-energy]').forEach(b => b.onclick = () => { mine.energy = b.dataset.energy; saveMine(); paintDials(); current = choose(); render(); });
$$('[data-size]').forEach(b => b.onclick = () => { mine.size = Number(b.dataset.size); saveMine(); paintDials(); current = choose(); render(); });

/* ================= COURSE TAB ================= */
let courseFilter = 'all', courseQ = '';
/* On the owner's own domain the real Kajabi course is the default view. */
let courseLive = ON_MYKAJABI;

/* Kajabi's own policy allows *.mykajabi.com to frame the course pages, so the
   real course can only sit inside the hub when the hub is served from one of
   the owner's own subdomains. From localhost, Kajabi refuses — so there we
   show the course natively instead.
   Add ?kajabi=1 to force the live frame on for testing. */
function courseCanBeFramed(){
  return ON_MYKAJABI || /[?&]kajabi=1/.test(location.search);
}

function renderCourse(){
  const col = $('#courseCol');
  const tab = $('#tab-course');
  const C = COMMUNITY;

  if (courseLive && courseCanBeFramed()){
    tab.classList.add('bleed');
    col.innerHTML = `<iframe class="bleedframe" src="${esc(C.courseUrl)}" title="FNH Foundations course"
                            referrerpolicy="no-referrer"
                            sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox"></iframe>`;
    return;
  }

  tab.classList.remove('bleed');
  if (!col.dataset.built){
    col.innerHTML = `
      <div class="toolbar">
        <input type="search" id="cq" placeholder="Search the course…">
        <button class="chip on" data-cf="all">all</button>
        <button class="chip" data-cf="unseen">unseen</button>
        <button class="chip" data-cf="practise">to practise</button>
        <span style="flex:1"></span>
        <button class="chip" id="cKajabi">Kajabi course ↗</button>
        ${courseCanBeFramed() ? '<button class="chip" id="cLive" style="background:#12312c;border-color:#1f5f54;color:#6ee7b7">Show the lesson list instead</button>' : ''}
      </div>
      <div id="courseList"></div>`;
    col.dataset.built = '1';
    $('#cq').oninput = e => { courseQ = e.target.value.toLowerCase(); renderCourseList(); };
    $$('[data-cf]').forEach(b => b.onclick = () => {
      courseFilter = b.dataset.cf;
      $$('[data-cf]').forEach(x => x.classList.toggle('on', x === b));
      renderCourseList();
    });
    $('#cKajabi').onclick = () => window.open(C.courseUrl, '_blank', 'noopener');
    const liveBtn = $('#cLive');
    if (liveBtn) liveBtn.onclick = () => { courseLive = !courseLive; renderCourse(); };  }
  renderCourseList();
}
function renderCourseList(){
  const host = $('#courseList');
  if (!host) return;
  const groups = new Map();
  COURSE.forEach(l => {
    if (courseQ && !(l.title.toLowerCase().includes(courseQ) || l.category.toLowerCase().includes(courseQ))) return;
    const s = get(l.id);
    if (courseFilter === 'unseen' && s.w) return;
    if (courseFilter === 'practise' && !(s.w && !s.p)) return;
    if (!groups.has(l.category)) groups.set(l.category, []);
    groups.get(l.category).push(l);
  });
  if (!groups.size){ host.innerHTML = '<div class="empty">Nothing matches that.</div>'; return; }
  let first = true;
  host.innerHTML = Array.from(groups).map(([cat, rows]) => {
    const seen = rows.filter(r => get(r.id).w).length;
    const done = rows.filter(r => get(r.id).t).length;
    const pct = rows.length ? Math.round(done/rows.length*100) : 0;
    const open = first ? ' open' : '';
    first = false;
    return `<div class="modbox${open}">
      <div class="modhead"><h3>${esc(cat)}</h3><span class="mc">${done}/${rows.length} can teach · ${seen} seen</span></div>
      <div class="modbar"><i style="width:${pct}%"></i></div>
      <div class="moditems">${rows.map(r => {
        const s = get(r.id);
        const d = r.duration ? Math.floor(r.duration/60)+':'+String(r.duration%60).padStart(2,'0') : '—';
        return `<div class="crow">
          <button class="tick w ${s.w?'on':''}" data-tw="${esc(r.id)}" title="Watched">W</button>
          <button class="tick p ${s.p?'on':''}" data-tp="${esc(r.id)}" title="Practised">P</button>
          <button class="tick t ${s.t?'on':''}" data-tt="${esc(r.id)}" title="Can teach">T</button>
          <div class="ct"><a href="${esc(r.video_url || r.page_url)}" target="_blank" rel="noopener">${esc(r.title)}</a></div>
          <span class="cd">${d}</span>
          <a class="mini" href="${esc(r.video_url || r.page_url)}" target="_blank" rel="noopener" title="Play">▶</a>
          <a class="mini" href="${esc(r.page_url)}" target="_blank" rel="noopener" title="Kajabi">K</a>
        </div>`;
      }).join('')}</div>
    </div>`;
  }).join('');
  host.querySelectorAll('.modhead').forEach(h => h.onclick = () => h.parentElement.classList.toggle('open'));
  host.querySelectorAll('[data-tw]').forEach(b => b.onclick = () => { const s = get(b.dataset.tw); s.w = s.w?0:1; saveTicks(); renderCourseList(); });
  host.querySelectorAll('[data-tp]').forEach(b => b.onclick = () => { const s = get(b.dataset.tp); s.p = s.p?0:1; if(s.p&&!s.w)s.w=1; saveTicks(); renderCourseList(); });
  host.querySelectorAll('[data-tt]').forEach(b => b.onclick = () => { const s = get(b.dataset.tt); s.t = s.t?0:1; if(s.t){s.p=1;s.w=1;} saveTicks(); renderCourseList(); });
}

/* ================= COMMUNITY TAB ================= */
/* Just the community, full width, nothing around it. */
const SERVED = location.protocol !== 'file:';
const ON_MYKAJABI = /(^|\.)mykajabi\.com$/i.test(location.hostname);

function renderCommunity(){
  const col = $('#communityCol');
  const C = COMMUNITY;
  const tab = $('#tab-community');
  if (SERVED){
    tab.classList.add('bleed');
    col.innerHTML = `
      <iframe class="bleedframe" src="${esc(C.home)}" title="Functional Neuro Health community"
              loading="lazy" referrerpolicy="no-referrer"
              sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox"></iframe>`;
    return;
  }
  /* opened as a file: the frame would be refused, so say so plainly */
  tab.classList.remove('bleed');
  col.innerHTML = `
    <div class="bleednote"><div>
      <b>The live community needs the hub served over http.</b>
      <p>Double-click <b>FNH_Hub.command</b> in this folder and use the page it opens.
      Kajabi only allows itself to be framed by an http or https page, not a file on disk.</p>
      <a class="ghost" style="display:inline-block" href="${esc(C.home)}" target="_blank" rel="noopener">Open the community in a tab ↗</a>
    </div></div>`;
}

/* ================= LIBRARY TAB ================= */
function renderLibrary(){
  $('#libraryCol').innerHTML = `
    <div class="h2">On this machine</div>
    <div class="tools">${LIBRARY.map(l => `<a class="tool" href="${esc(l.url)}"${l.external ? ' target="_blank" rel="noopener"' : ''}>
      <b>${esc(l.name)}</b><span>${esc(l.note)}</span></a>`).join('')}</div>
    <div class="h2">Course</div>
    <div class="door">
      <div><b>FNH Foundations — 146 lessons</b><span>Portal order, 32.8 hours, direct links to every video</span></div>
      <a href="${esc(COMMUNITY.courseUrl || '#')}" target="_blank" rel="noopener">Kajabi ↗</a>
    </div>
    <div class="h2">Reference</div>
    <div class="tools">${LIBRARY.filter(l=>l.group==='reference').map(l => `<a class="tool" href="${esc(l.url)}"${l.external?' target="_blank" rel="noopener"':''}>
      <b>${esc(l.name)}</b><span>${esc(l.note)}</span></a>`).join('')}</div>`;
}

/* ================= go ================= */
paintDials();
updateParkPip();
paintTimer();
if (!timer.running && !timer.endsAt) { timer.remaining = timer.mins*60; }
$('#timerMins').value = timer.mins;
$$('#presets button').forEach(b => b.classList.toggle('on', Number(b.dataset.m) === timer.mins));
render();
showTab(tabFromHash());
})();
</script>
</body></html>
